# reSpeaker XVF3800 + XIAO ESP32S3, driven by the reSpeaker Agent app (not HA Assist).
# Layout from formatBCE's README for release 2026.10.4. Needs ESPHome 2026.10.0+.
# No `api: encryption:` on purpose: the agent connects without a noise key.
# After flashing: DSP route -> "ASR to STT and wake word", raise "ASR output gain".
substitutions:
  name: respeaker-xvf3800-assistant
  friendly_name: reSpeaker XVF3800 Assistant
  respeaker_ref: 2026.10.4

packages:
  respeaker:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/timers-alarm.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
