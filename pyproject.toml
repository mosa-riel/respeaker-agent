[project]
name = "respeaker-agent"
version = "0.1.0"
description = "Custom voice agent for the reSpeaker XVF3800 — owns the device, fans tools in from MCP servers, drives the reTerminal e-paper."
requires-python = ">=3.11"
dependencies = [
    "aioesphomeapi>=24",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "soxr>=0.5",
    "mcp>=1.27.2",
    "soundfile>=0.14.0",
    "ddgs>=9.14.4",
]

[project.scripts]
respeaker-agent = "respeaker_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/respeaker_agent"]
