configuration:
  api_key:
    name: API key
    description: Your OpenAI-compatible provider key (e.g. Mistral). Used for STT/TTS, and for the LLM unless an LLM API key is set.
  llm_api_key:
    name: LLM API key
    description: Optional key for a different LLM provider (llm_base_url). Empty = use the API key.
  device_host:
    name: reSpeaker IP
    description: IP address of the reSpeaker device (e.g. 192.168.18.151). Use the IP, not the .local name.
  tts_audio_host:
    name: HA host IP (TTS audio)
    description: This Home Assistant host's LAN IP (e.g. 192.168.18.31). The reSpeaker fetches spoken replies from here.
  voice_enabled:
    name: Enable voice
    description: Take over the reSpeaker's wake-word voice pipeline. Stop Home Assistant's own Assist for this device first.
  stt_realtime:
    name: Realtime turn detection
    description: Stream the mic to a realtime STT model that decides when you are done talking (waits through thinking pauses). The final text still comes from the STT model. Off = fixed silence (vad_silence_ms).
  stt_realtime_model:
    name: Realtime STT model
    description: Model for realtime turn detection (Mistral voxtral-mini-transcribe-realtime-3 supports the language and word list).
  stt_realtime_min_silence_ms:
    name: Realtime minimum silence (ms)
    description: Shortest pause before the realtime model may end the turn.
  vad_engine:
    name: Speech detection
    description: micro = local speech model, pymicro-vad (ignores fans and hum, ~0.5 s detection lag); energy = loudness above vad_threshold.
  vad_speech_prob:
    name: Silero speech probability
    description: 10 ms of audio counts as speech at or above this probability (micro only).
