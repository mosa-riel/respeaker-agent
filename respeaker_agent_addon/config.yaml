# Home Assistant add-on manifest for the reSpeaker agent.
#
# host_network: the agent connects to the reSpeaker over the ESPHome native API (:6053)
#   by mDNS, and serves the TTS audio host (:8731) that the device fetches playback from
#   — both need the host's real LAN identity (the TTS url auto-detects the host IP, which
#   only works on the host network). With host_network the :8731 port is bound directly
#   on the host; no `ports` mapping is needed.
# ingress: the web UI is served through the HA frontend (authenticated, no separate LAN
#   port). Because host_network also exposes :8099 on the LAN, the app rejects any client
#   that isn't the ingress proxy (172.30.32.2) — see RESPEAKER_INGRESS in web.py.
name: reSpeaker Agent
version: "0.1.0"
slug: respeaker_agent
description: Self-owned voice agent for the reSpeaker XVF3800 — wake → STT → LLM (+MCP tools) → TTS, with a live trace UI
url: https://github.com/mosa-riel/respeaker-agent
arch:
  - aarch64
  - amd64
init: true
boot: auto
startup: services
host_network: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:microphone-message
options:
  mistral_api_key: ""
  device_host: respeaker-xvf3800-assistant.local
  voice_enabled: true
schema:
  mistral_api_key: "password?"
  device_host: str
  voice_enabled: bool
