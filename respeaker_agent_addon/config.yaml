# Home Assistant add-on manifest for the reSpeaker agent.
#
# BRIDGED network (not host_network): this keeps the agent on the Supervisor's internal
# network, so it can RESOLVE the MCP add-ons by their hostnames (a host_network add-on
# cannot — that was the whole networking headache). Add each MCP in the agent's UI as
# http://<that add-on's Hostnaam>:<port>/mcp.
# - The reSpeaker is reached OUTBOUND by IP (set device_host to its IP — bridged has no
#   mDNS, so its .local name won't resolve).
# - The device fetches TTS audio FROM the agent, so the agent must hand it a LAN-reachable
#   URL: we publish :8731 (ports) and advertise the host's LAN IP (tts_audio_host).
# - ingress serves the UI through the HA frontend (authenticated); on bridged it is NOT
#   exposed on the LAN. The 172.30.32.2 source guard (RESPEAKER_INGRESS) stays as
#   defense-in-depth.
name: reSpeaker Agent
version: "0.2.8"
slug: respeaker_agent
description: Self-owned voice agent for the reSpeaker XVF3800 — wake → STT → LLM (+MCP tools) → TTS, with a live trace UI
url: https://github.com/mosa-riel/respeaker-agent
arch:
  - aarch64
  - amd64
init: true
boot: auto
startup: services
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:microphone-message
ports:
  8731/tcp: 8731
ports_description:
  8731/tcp: TTS audio the reSpeaker fetches for playback (set tts_audio_host to this host's LAN IP)
options:
  api_key: ""
  device_host: 192.168.18.151
  tts_audio_host: 192.168.18.31
  voice_enabled: true
schema:
  api_key: "password?"
  device_host: str
  tts_audio_host: str
  voice_enabled: bool
